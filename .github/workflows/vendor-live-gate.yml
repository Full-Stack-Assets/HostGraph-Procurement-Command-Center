name: HostGraph Regional Vendor Live Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_vendor_gate:
    runs-on: ubuntu-latest
    environment: hostgraph-regional-live
    timeout-minutes: 45
    env:
      HOSTGRAPH_RELEASE_HMAC_KEY: ${{ secrets.HOSTGRAPH_RELEASE_HMAC_KEY }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_BASE_URL }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_READ_PATH }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_AUTH_KIND }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_TOKEN }}
      HOSTGRAPH_VENDOR_SYSCO_BOSTON_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_SYSCO_BOSTON_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_US_FOODS_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_BASE_URL }}
      HOSTGRAPH_VENDOR_US_FOODS_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_READ_PATH }}
      HOSTGRAPH_VENDOR_US_FOODS_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_US_FOODS_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_AUTH_KIND }}
      HOSTGRAPH_VENDOR_US_FOODS_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_TOKEN }}
      HOSTGRAPH_VENDOR_US_FOODS_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_US_FOODS_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_BASE_URL }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_READ_PATH }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_AUTH_KIND }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_TOKEN }}
      HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_PERFORMANCE_FOODSERVICE_BOSTON_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_BASE_URL }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_READ_PATH }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_AUTH_KIND }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_TOKEN }}
      HOSTGRAPH_VENDOR_BALDOR_BOSTON_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_BALDOR_BOSTON_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_BASE_URL }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_READ_PATH }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_AUTH_KIND }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_TOKEN }}
      HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_COSTA_FRUIT_PRODUCE_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_BASE_URL }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_READ_PATH }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_AUTH_KIND }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_TOKEN }}
      HOSTGRAPH_VENDOR_MARTIGNETTI_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_MARTIGNETTI_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_BASE_URL }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_READ_PATH }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_AUTH_KIND }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_TOKEN }}
      HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_SOUTHERN_GLAZERS_MA_RI_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_MS_WALKER_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_BASE_URL }}
      HOSTGRAPH_VENDOR_MS_WALKER_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_READ_PATH }}
      HOSTGRAPH_VENDOR_MS_WALKER_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_MS_WALKER_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_AUTH_KIND }}
      HOSTGRAPH_VENDOR_MS_WALKER_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_TOKEN }}
      HOSTGRAPH_VENDOR_MS_WALKER_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_MS_WALKER_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_BASE_URL }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_READ_PATH }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_AUTH_KIND }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_TOKEN }}
      HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_MANCINI_BEVERAGE_AUTHORIZATION_BASIS }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_BASE_URL: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_BASE_URL }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_READ_PATH: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_READ_PATH }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_ACCOUNT_ID: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_ACCOUNT_ID }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_AUTH_KIND: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_AUTH_KIND }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_TOKEN: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_TOKEN }}
      HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_AUTHORIZATION_BASIS: ${{ secrets.HOSTGRAPH_VENDOR_SHEEHAN_REGIONAL_AUTHORIZATION_BASIS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm check
      - run: pnpm build
      - name: Bind release hashes
        shell: bash
        run: |
          set +x
          echo "HOSTGRAPH_RELEASE_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "HOSTGRAPH_RELEASE_BUILD_SHA256=$(sha256sum dist/index.js | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "HOSTGRAPH_CI_REFERENCE=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Run 10/10 vendor gate
        run: pnpm gate:vendors -- --json
      - name: Create and verify release manifest
        run: pnpm release:manifest
      - name: Upload safe release evidence only
        uses: actions/upload-artifact@v4
        with:
          name: hostgraph-regional-release-evidence
          path: |
            .hostgraph/release/vendor-receipts/*.json
            .hostgraph/release/release-manifest.json
          if-no-files-found: error
          retention-days: 14
