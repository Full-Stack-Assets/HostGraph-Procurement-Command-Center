name: HostGraph One-Time Evidence UI Integration

on:
  push:
    branches: [fix/hostgraph-evidence-ui-2026-08-25]
    paths: [.github/workflows/evidence-ui-integrate.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hostgraph-evidence-ui-2026-08-25

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply evidence UI integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/MarginGapPage.tsx')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "import { useSearchParams } from 'react-router-dom';\n",
              "import { useSearchParams } from 'react-router-dom';\nimport type { Finding } from '@shared/contracts/findings';\nimport { DataStatusRail } from '@/components/DataStatusRail';\nimport { FindingInspector } from '@/components/FindingInspector';\n",
              'evidence imports',
          )

          replace_once(
              "  const activeId = searchParams.get('ingredientId') || marginResponse.data.rows[0]?.ingredientId || '';\n",
              "  const activeId = searchParams.get('ingredientId') || marginResponse.data.rows[0]?.ingredientId || '';\n  const activeRow = marginResponse.data.rows.find((row) => row.ingredientId === activeId) ?? null;\n\n  const activeFinding = useMemo<Finding | null>(() => {\n    if (marginResponse.mode !== 'DEMO' || !activeRow) return null;\n\n    return {\n      id: `demo-${activeRow.ingredientId}`,\n      accountId: 'demo-boston-portfolio',\n      locationId: activeRow.location,\n      vendorId: activeRow.vendor,\n      sourceRecordIds: [`fixture:${activeRow.ingredientId}`],\n      sourcePeriod: { from: filters.dateFrom, to: filters.dateTo },\n      observedAmount: activeRow.actualCost,\n      calculatedVariance: activeRow.actualCost - activeRow.theoreticalCost,\n      calculationMethod: 'synthetic-actual-minus-theoretical-unit-cost',\n      calculationVersion: 'demo-v1',\n      confidence: 0,\n      evidenceState: 'DETECTED',\n      reviewerState: 'UNREVIEWED',\n      createdAt: `${filters.dateFrom}T00:00:00.000Z`,\n      updatedAt: `${filters.dateTo}T00:00:00.000Z`,\n      provenance: [\n        {\n          sourceSystem: 'HostGraph synthetic fixture',\n          sourceRecordId: `fixture:${activeRow.ingredientId}`,\n          locator: `client/src/data/mockData.ts#${activeRow.ingredientId}`,\n        },\n      ],\n    };\n  }, [activeRow, filters.dateFrom, filters.dateTo, marginResponse.mode]);\n",
              'synthetic finding derivation',
          )

          replace_once(
              "      <PageStateBanner usingFallback={marginResponse.usingFallback || drilldownResponse.usingFallback} error={marginResponse.error || drilldownResponse.error} />\n",
              "      <PageStateBanner usingFallback={marginResponse.usingFallback || drilldownResponse.usingFallback} error={marginResponse.error || drilldownResponse.error} />\n\n      <DataStatusRail\n        mode={marginResponse.mode}\n        fetchedAt={marginResponse.fetchedAt}\n        sourceCoverage={null}\n        invoicesProcessed={null}\n        invoicesAwaitingReview={null}\n        dataExceptions={null}\n      />\n",
              'data status rail render',
          )

          replace_once(
              "          {drilldownResponse.loading ? <LoadingPanel label=\"Loading ingredient drill-down…\" /> : (\n            <Surface>\n              <SectionHeading eyebrow=\"Drill-down\" title={drilldownResponse.data.ingredient} description={drilldownResponse.data.story} />\n              <div className=\"mt-6 grid gap-3 md:grid-cols-3\">\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Invoice delta</p><p className=\"mt-2 font-mono text-xl text-red-300\">{drilldownResponse.data.invoiceDelta}</p></div>\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Yield delta</p><p className=\"mt-2 font-mono text-xl text-amber-200\">{drilldownResponse.data.yieldDelta}</p></div>\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Benchmark delta</p><p className=\"mt-2 font-mono text-xl text-cyan-200\">{drilldownResponse.data.benchmarkDelta}</p></div>\n              </div>\n              <div className=\"mt-6 h-64\"><BarChart className=\"h-64\" data={drilldownResponse.data.events} index=\"label\" categories={['value']} colors={['emerald']} showLegend={false} valueFormatter={(value) => `${value}`} yAxisWidth={56} /></div>\n            </Surface>\n          )}\n",
              "          {drilldownResponse.loading ? <LoadingPanel label=\"Loading ingredient drill-down…\" /> : (\n            <Surface>\n              <SectionHeading eyebrow=\"Drill-down\" title={drilldownResponse.data.ingredient} description={drilldownResponse.data.story} />\n              <div className=\"mt-6 grid gap-3 md:grid-cols-3\">\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Invoice delta</p><p className=\"mt-2 font-mono text-xl text-red-300\">{drilldownResponse.data.invoiceDelta}</p></div>\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Yield delta</p><p className=\"mt-2 font-mono text-xl text-amber-200\">{drilldownResponse.data.yieldDelta}</p></div>\n                <div className=\"rounded-2xl border border-white/8 bg-white/[0.03] p-4\"><p className=\"text-xs uppercase tracking-[0.24em] text-zinc-500\">Benchmark delta</p><p className=\"mt-2 font-mono text-xl text-cyan-200\">{drilldownResponse.data.benchmarkDelta}</p></div>\n              </div>\n              <div className=\"mt-6 h-64\"><BarChart className=\"h-64\" data={drilldownResponse.data.events} index=\"label\" categories={['value']} colors={['emerald']} showLegend={false} valueFormatter={(value) => `${value}`} yAxisWidth={56} /></div>\n            </Surface>\n          )}\n\n          <FindingInspector\n            mode={marginResponse.mode}\n            finding={activeFinding}\n            unavailableReason={\n              marginResponse.mode === 'DEMO'\n                ? 'No synthetic finding is available for the current row.'\n                : 'Current margin API does not yet expose a source-complete Finding record.'\n            }\n          />\n",
              'finding inspector render',
          )

          path.write_text(source)
          PY

          rm .github/workflows/evidence-ui-integrate.yml

      - name: Verify complete non-live release gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node --test tests/interface-rebuild.test.mjs
          pnpm test:unit
          pnpm check
          VITE_HOSTGRAPH_MODE=DEMO pnpm build
          pnpm check:boundary
          pnpm check:bundle
          pnpm audit:prod

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/MarginGapPage.tsx .github/workflows/evidence-ui-integrate.yml
          git commit -m 'feat: integrate evidence UI into Margin Gap'
          git push origin HEAD:fix/hostgraph-evidence-ui-2026-08-25
