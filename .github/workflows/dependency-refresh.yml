name: HostGraph One-Time Dependency Refresh

on:
  push:
    branches: [review/hostgraph-hardening-2026-08-25]
    paths: [.github/workflows/dependency-refresh.yml]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hostgraph-hardening-2026-08-25
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Refresh vulnerable dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm remove axios nanoid streamdown recharts
          pnpm add express@4.22.2 react-router-dom@7.18.2
          pnpm pkg set 'pnpm.overrides.path-to-regexp=0.1.13'
          pnpm pkg set 'pnpm.overrides.lodash=4.18.1'
          pnpm install --lockfile-only
      - name: Verify remediated dependency graph
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm test:unit
          pnpm check
          VITE_HOSTGRAPH_MODE=DEMO pnpm build
          pnpm check:boundary
          pnpm check:bundle
      - name: Commit refreshed manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'deps: remediate HostGraph production audit findings'
          git push origin HEAD:review/hostgraph-hardening-2026-08-25
