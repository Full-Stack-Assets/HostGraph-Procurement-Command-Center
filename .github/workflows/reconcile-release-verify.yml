name: HostGraph Reconciliation Release Verification

on:
  push:
    branches:
      - reconcile/hostgraph-mickey-lineage-2026-08-27

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Interface contract
        run: node --test tests/interface-rebuild.test.mjs

      - name: Unit and contract tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm check

      - name: Build production DEMO artifact
        run: VITE_HOSTGRAPH_MODE=DEMO pnpm build

      - name: Production source boundary
        run: pnpm check:boundary

      - name: Bundle budget
        run: pnpm check:bundle

      - name: Production dependency audit
        run: pnpm audit:prod
